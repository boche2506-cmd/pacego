<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神盾小弟：低頭族救星 1.0</title>
    <style>
        body { margin: 0; background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; overflow: hidden; }
        #loading-screen { position: fixed; top:0; left:0; width:100vw; height:100vh; background:#121212; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:999; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #00e676; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #pip-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #1a1a1a; position: relative; }
        /* 利用 HTML5 Video 偽裝成即時影片流，強行開啟 iOS 子母畫面後門 */
        video { width: 100%; height: 180px; background: #000; border-radius: 8px; }
        #control-panel { height: 45vh; background: #222; padding: 20px; display: flex; flex-direction: column; justify-content: space-around; border-top: 1px solid #333; }
        .switch-group { display: flex; justify-content: space-between; align-items: center; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .btn-group { display: flex; gap: 20px; height: 40%; }
        .cal-btn { flex: 1; border: none; border-radius: 16px; font-size: 28px; font-weight: bold; color: #fff; cursor: pointer; active { transform: scale(0.95); } }
        #btn-red { background: #ff1744; box-shadow: 0 0 20px rgba(255,23,68,0.4); }
        #btn-green { background: #00e676; box-shadow: 0 0 20px rgba(0,230,118,0.4); }
    </style>
</head>
<body>

    <!-- CEO 拍板：B 案極簡初始化下載畫面 -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="margin-top: 20px; color: #aaa; font-size: 14px;">系統初始化...</p>
        <p style="color: #00e676; font-size: 16px; font-weight: bold; margin-top: 5px;">已自動載入大台北 24 條核心路廊號誌規律</p>
    </div>

    <!-- 上半螢幕：iOS 永遠最上層子母畫面核心區 -->
    <div id="pip-container">
        <!-- 核心黑科技：畫布渲染轉影片流，實現滑抖音、看 Google Map 永遠置頂 -->
        <video id="pip-video" playsinline autoplay muted></video>
        <canvas id="stage" width="400" height="180" style="display:none;"></canvas>
        <button id="start-pip-btn" style="position:absolute; background:#00e676; border:none; padding:12px 24px; border-radius:30px; font-size:18px; font-weight:bold; color:#000;">開啟懸浮倒計時</button>
    </div>

    <!-- 下半螢幕：CEO 專利實戰控制板 -->
    <div id="control-panel">
        <div class="switch-group">
            <span>🔊 綠燈亮起聲音提示</span>
            <input type="checkbox" id="sound-toggle" checked style="width:24px; height:24px;">
        </div>
        <div class="switch-group">
            <span>📳 綠燈亮起震動提示</span>
            <input type="checkbox" id="vibrate-toggle" checked style="width:24px; height:24px;">
        </div>
        
        <!-- CEO 專利：綠燈靜止起步秒按校準雙鈕 -->
        <div class="btn-group">
            <button class="cal-btn" id="btn-red">紅燈亮<br><span style="font-size:14px; font-weight:normal;">補按校準</span></button>
            <button class="cal-btn" id="btn-green">綠燈亮<br><span style="font-size:14px; font-weight:normal;">起步秒按</span></button>
        </div>
    </div>

    <script>
        // 模擬離線資料庫載入（包含執行長 04:12:45 新生民生路口的初始密碼）
        setTimeout(() => {
            document.getElementById('loading-screen').style.display = 'none';
        }, 1800);

        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('pip-video');
        let currentSec = 24, nextSec = 45;

        // 繪製極簡子母畫面：[ 當前路口 🔴 24 ] [ 下個路口 🟢 45 ]
        function drawCanvas() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 400, 180);
            
            // 當前路口 (最後 3 秒會觸發閃爍)
            ctx.fillStyle = (currentSec <= 3 && Math.floor(Date.now()/200)%2==0) ? '#121212' : '#ff1744';
            ctx.beginPath(); ctx.arc(40, 90, 15, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 36px sans-serif';
            ctx.fillText(currentSec, 70, 102);

            // 下個路口
            ctx.fillStyle = '#00e676';
            ctx.beginPath(); ctx.arc(220, 90, 15, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.fillText(nextSec, 250, 102);
        }

        // 每秒自計時（離線架構）
        setInterval(() => {
            if(currentSec > 1) currentSec--; else currentSec = 60;
            if(nextSec > 1) nextSec--; else nextSec = 90;
            drawCanvas();
        }, 1000);

        // 串接 iOS 子母畫面 API
        const stream = canvas.captureStream(30);
        video.srcObject = stream;
        document.getElementById('start-pip-btn').addEventListener('click', () => {
            video.requestPictureInPicture();
            document.getElementById('start-pip-btn').style.display = 'none';
        });

        // CEO 專利：大綠鈕起步秒按事件
        document.getElementById('btn-green').addEventListener('click', () => {
            currentSec = 60; // 瞬間將當前路口校準為綠燈起始
            if(document.getElementById('vibrate-toggle').checked) navigator.vibrate([100, 50, 100]);
            drawCanvas();
        });
    </script>
</body>
</html>
