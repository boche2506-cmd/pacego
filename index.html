<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>神盾小弟：低頭族救星 2.0 強固版</title>
    <style>
        body { margin: 0; background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; overflow: hidden; }
        #loading-screen { position: fixed; top:0; left:0; width:100vw; height:100vh; background:#121212; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:999; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #00e676; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #pip-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #1a1a1a; position: relative; }
        video { width: 100%; height: 180px; background: #000; border-radius: 8px; }
        #control-panel { height: 45vh; background: #222; padding: 20px; display: flex; flex-direction: column; justify-content: space-around; border-top: 1px solid #333; }
        .switch-group { display: flex; justify-content: space-between; align-items: center; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .btn-group { display: flex; gap: 20px; height: 40%; }
        .cal-btn { flex: 1; border: none; border-radius: 16px; font-size: 28px; font-weight: bold; color: #fff; cursor: pointer; transition: transform 0.1s ease; }
        /* 修正原本遺漏冒號的 Bug */
        .cal-btn:active { transform: scale(0.95); }
        #btn-red { background: #ff1744; box-shadow: 0 0 20px rgba(255,23,68,0.4); }
        #btn-green { background: #00e676; box-shadow: 0 0 20px rgba(0,230,118,0.4); }
    </style>
</head>
<body>

    <!-- 初始化下載畫面 -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="margin-top: 20px; color: #aaa; font-size: 14px;">系統初始化...</p>
        <p style="color: #00e676; font-size: 16px; font-weight: bold; margin-top: 5px;">已自動載入大台北 24 條核心路廊號誌規律</p>
    </div>

    <!-- 上半螢幕：iOS 永遠最上層子母畫面核心區 -->
    <div id="pip-container">
        <video id="pip-video" playsinline autoplay muted></video>
        <canvas id="stage" width="400" height="180" style="display:none;"></canvas>
        <button id="start-pip-btn" style="position:absolute; background:#00e676; border:none; padding:12px 24px; border-radius:30px; font-size:18px; font-weight:bold; color:#000;">開啟懸浮倒計時</button>
    </div>

    <!-- 下半螢幕：實戰控制板 -->
    <div id="control-panel">
        <div class="switch-group">
            <span>🔊 綠燈亮起聲音提示</span>
            <input type="checkbox" id="sound-toggle" checked style="width:24px; height:24px;">
        </div>
        <div class="switch-group">
            <span>📳 綠燈亮起震動提示</span>
            <input type="checkbox" id="vibrate-toggle" checked style="width:24px; height:24px;">
        </div>
        
        <div class="btn-group">
            <button class="cal-btn" id="btn-red">紅燈亮<br><span style="font-size:14px; font-weight:normal;">補按校準</span></button>
            <button class="cal-btn" id="btn-green">綠燈亮<br><span style="font-size:14px; font-weight:normal;">起步秒按</span></button>
        </div>
    </div>

    <script>
        // 延時關閉加載畫面
        setTimeout(() => {
            document.getElementById('loading-screen').style.display = 'none';
        }, 1200);

        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('pip-video');
        
        let currentSec = 24;
        let nextSec = 45;
        let audioCtx = null;

        // 初始化畫布防白畫面線：確保一開始就有畫面
        drawCanvas();

        function drawCanvas() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 400, 180);
            
            // 當前路口 (倒數 3 秒內閃爍)
            ctx.fillStyle = (currentSec <= 3 && Math.floor(Date.now()/200)%2==0) ? '#1a1a1a' : '#ff1744';
            ctx.beginPath(); ctx.arc(60, 90, 20, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 42px sans-serif';
            ctx.fillText(currentSec, 100, 105);

            // 下個路口
            ctx.fillStyle = '#00e676';
            ctx.beginPath(); ctx.arc(240, 90, 20, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.fillText(nextSec, 280, 105);
        }

        // 強固防凍結核心：使用精確時間戳差值計算，防止網頁背景化時倒數變慢
        let lastUpdateTime = Date.now();
        setInterval(() => {
            const now = Date.now();
            if (now - lastUpdateTime >= 1000) {
                const passedSeconds = Math.floor((now - lastUpdateTime) / 1000);
                
                currentSec = currentSec - passedSeconds;
                if (currentSec <= 0) currentSec = 60 + currentSec;
                
                nextSec = nextSec - passedSeconds;
                if (nextSec <= 0) nextSec = 90 + nextSec;
                
                lastUpdateTime = now;
                drawCanvas();
            }
        }, 200); // 提高檢查頻率至 200ms，確保切回時秒數瞬間校準

        // 啟動音訊背景存活防線
        function initAudioStayAlive() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                // 建立極微弱的靜音震盪器，強迫 iOS 瀏覽器維持執行緒，防止計時器被凍結
                const buffer = audioCtx.createBuffer(1, 1, 22050);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.loop = true;
                source.connect(audioCtx.destination);
                source.start();
            }
        }

        // 串接 iOS 子母畫面 API
        const stream = canvas.captureStream(30);
        video.srcObject = stream;

        document.getElementById('start-pip-btn').addEventListener('click', () => {
            initAudioStayAlive(); // 點擊時同步啟動音訊背景線
            video.requestPictureInPicture()
                .then(() => {
                    document.getElementById('start-pip-btn').style.display = 'none';
                })
                .catch(err => {
                    console.error("PiP 啟動失敗:", err);
                    alert("請重新點擊啟動懸浮功能");
                });
        });

        // 綠燈起步秒按校準
        document.getElementById('btn-green').addEventListener('click', () => {
            currentSec = 60;
            lastUpdateTime = Date.now();
            if(document.getElementById('vibrate-toggle').checked && navigator.vibrate) {
                navigator.vibrate([100, 50, 100]);
            }
            drawCanvas();
        });

        // 紅燈補按校準
        document.getElementById('btn-red').addEventListener('click', () => {
            currentSec = 24; // 回歸預設或當前基準值
            lastUpdateTime = Date.now();
            drawCanvas();
        });
    </script>
</body>
</html>
