<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>神盾小弟：低頭族救星 2.0 號誌補償版</title>
    <style>
        body { margin: 0; background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; overflow: hidden; }
        #loading-screen { position: fixed; top:0; left:0; width:100vw; height:100vh; background:#121212; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:999; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #00e676; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #pip-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #1a1a1a; position: relative; }
        video { width: 100%; height: 120px; background: #000; border-radius: 8px; }
        #control-panel { height: 45vh; background: #222; padding: 20px; display: flex; flex-direction: column; justify-content: space-around; border-top: 1px solid #333; }
        .switch-group { display: flex; justify-content: space-between; align-items: center; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .btn-group { display: flex; gap: 20px; height: 40%; }
        .cal-btn { flex: 1; border: none; border-radius: 16px; font-size: 28px; font-weight: bold; color: #fff; cursor: pointer; transition: transform 0.1s ease; }
        .cal-btn:active { transform: scale(0.95); }
        #btn-red { background: #ff1744; box-shadow: 0 0 20px rgba(255,23,68,0.4); }
        #btn-green { background: #00e676; box-shadow: 0 0 20px rgba(0,230,118,0.4); }
    </style>
</head>
<body>

    <!-- 初始化下載畫面 -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="margin-top: 20px; color: #aaa; font-size: 14px;">系統初始化...</p>
        <p style="color: #00e676; font-size: 16px; font-weight: bold; margin-top: 5px;">已自動載入建國北路核心號誌規律與清道補償</p>
    </div>

    <!-- 上半螢幕：iOS 永遠最上層子母畫面核心區 -->
    <div id="pip-container">
        <video id="pip-video" playsinline autoplay muted></video>
        <canvas id="stage" width="360" height="120" style="display:none;"></canvas>
        <button id="start-pip-btn" style="position:absolute; background:#00e676; border:none; padding:12px 24px; border-radius:30px; font-size:18px; font-weight:bold; color:#000;">開啟懸浮倒計時</button>
    </div>

    <!-- 下半螢幕：實戰控制板 -->
    <div id="control-panel">
        <div class="switch-group">
            <span>🔊 綠燈亮起聲音提示</span>
            <input type="checkbox" id="sound-toggle" checked style="width:24px; height:24px;">
        </div>
        <div class="switch-group">
            <span>📳 綠燈亮起震動提示</span>
            <input type="checkbox" id="vibrate-toggle" checked style="width:24px; height:24px;">
        </div>
        
        <div class="btn-group">
            <button class="cal-btn" id="btn-red">紅燈亮<br><span style="font-size:14px; font-weight:normal;">補按校準</span></button>
            <button class="cal-btn" id="btn-green">綠燈亮<br><span style="font-size:14px; font-weight:normal;">起步秒按</span></button>
        </div>
    </div>

    <script>
        setTimeout(() => {
            document.getElementById('loading-screen').style.display = 'none';
        }, 1200);

        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('pip-video');
        
        // 🛠️ 號誌結構常數設定（建國北路標準規格：黃燈3秒、全紅2秒）
        const YELLOW_TIME = 3;
        const ALL_RED_TIME = 2;
        
        // 狀態變數：'GREEN' (綠燈), 'YELLOW' (黃燈), 'ALL_RED' (全紅), 'RED' (紅燈)
        let currentStatus = 'RED'; 
        let currentSec = 60; // 預設紅燈 60 秒
        let nextSec = 45;

        // 初始化繪製
        drawCanvas();

        // 🛠️ 精密畫布渲染引擎：新增黃燈與全紅（偽透明底色）
        function drawCanvas() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 360, 120);
            
            const centerY = 60;   
            const radius = 38;    

            // 1. 決定左側「當前路口」燈號顏色
            let currentLightColor = '#ff1744'; // 預設紅燈
            if (currentStatus === 'GREEN') {
                currentLightColor = '#00e676';
            } else if (currentStatus === 'YELLOW') {
                currentLightColor = '#ffb300'; // 精品黃
            } else if (currentStatus === 'ALL_RED') {
                // 全紅狀態下，最後一秒會閃爍提示準備變綠
                currentLightColor = (currentSec === 1 && Math.floor(Date.now()/200)%2==0) ? '#1a1a1a' : '#ff1744';
            }

            // 繪製左側當前路口號誌
            ctx.fillStyle = currentLightColor;
            ctx.beginPath(); 
            ctx.arc(52, centerY, radius, 0, Math.PI*2); 
            ctx.fill();
            
            ctx.fillStyle = '#ffffff'; 
            ctx.font = 'bold 54px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.fillText(currentSec, 110, centerY + 18);     

            // 2. 繪製右側交叉路口號誌（簡化連動狀態）
            let nextLightColor = '#00e676';
            if (currentStatus === 'GREEN' || currentStatus === 'YELLOW' || currentStatus === 'ALL_RED') {
                nextLightColor = '#ff1744';
            }
            ctx.fillStyle = nextLightColor;
            ctx.beginPath(); 
            ctx.arc(222, centerY, radius, 0, Math.PI*2); 
            ctx.fill();
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 54px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.fillText(nextSec, 280, centerY + 18);
        }

        // 🛠️ 號誌狀態機核心邏輯：自動補償黃燈與全紅清道時差
        function tickLogic() {
            currentSec--;
            
            // 交叉路口計時同步遞減
            if (nextSec > 1) nextSec--; else nextSec = 90;

            // 當前路口計時歸零時，切換狀態
            if (currentSec <= 0) {
                if (currentStatus === 'GREEN') {
                    currentStatus = 'YELLOW';
                    currentSec = YELLOW_TIME;
                } else if (currentStatus === 'YELLOW') {
                    currentStatus = 'ALL_RED';
                    currentSec = ALL_RED_TIME;
                } else if (currentStatus === 'ALL_RED') {
                    currentStatus = 'RED';
                    currentSec = 60; // 進入紅燈循環
                } else if (currentStatus === 'RED') {
                    currentStatus = 'GREEN';
                    currentSec = 45; // 進入綠燈循環
                    triggerAlert(200); // 綠燈亮起聲音震動
                }
            }
            drawCanvas();
        }

        // 強固防凍結排程器（200ms 高頻檢查）
        let lastUpdateTime = Date.now();
        setInterval(() => {
            const now = Date.now();
            if (now - lastUpdateTime >= 1000) {
                const passedSeconds = Math.floor((now - lastUpdateTime) / 1000);
                for(let i = 0; i < passedSeconds; i++) {
                    tickLogic();
                }
                lastUpdateTime = now;
            }
        }, 200);

        // 背景存活音訊防線
        let audioCtx = null;
        function initAudioStayAlive() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const buffer = audioCtx.createBuffer(1, 1, 22050);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.loop = true;
                source.connect(audioCtx.destination);
                source.start();
            }
        }

        function triggerAlert(duration = 100) {
            if (document.getElementById('vibrate-toggle').checked && navigator.vibrate) {
                navigator.vibrate([duration, 50, duration]);
            }
            if (document.getElementById('sound-toggle').checked && audioCtx) {
                const osc = audioCtx.createOscillator();
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + (duration / 1000));
            }
        }

        // 串接 iOS 子母畫面
        const stream = canvas.captureStream(30);
        video.srcObject = stream;
        document.getElementById('start-pip-btn').addEventListener('click', () => {
            initAudioStayAlive();
            video.requestPictureInPicture()
                .then(() => { document.getElementById('start-pip-btn').style.display = 'none'; })
                .catch(err => { alert("請重新點擊啟動懸浮功能"); });
        });

        // 🟢 大綠鈕：起步秒按校準事件
        document.getElementById('btn-green').addEventListener('click', () => {
            currentStatus = 'GREEN';
            currentSec = 45; // 強制校正為綠燈起始秒數
            lastUpdateTime = Date.now();
            drawCanvas();
        });

        // 🔴 大紅鈕：補按校準事件
        document.getElementById('btn-red').addEventListener('click', () => {
            currentStatus = 'RED';
            currentSec = 60; // 強制校正為紅燈起始秒數
            lastUpdateTime = Date.now();
            drawCanvas();
        });
    </script>
</body>
</html>
